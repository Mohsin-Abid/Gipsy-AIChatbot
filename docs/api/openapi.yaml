openapi: 3.1.0

info:
  title: AI Tutor API
  version: "1.0.0"
  description: |
    The backend contract for the AI Tutor Android app.

    Every schema here mirrors a type that already exists in the client, so the names and enum values
    are not invented — they are the wire form of `StudentProfile`, `StudyTool`, `AnswerBlock` and
    the rest. `docs/api/README.md` holds the prose: the auth exchange, the quota model, the error
    table and the Google Cloud setup this depends on.

    Conventions:
      * JSON in and out, camelCase fields, SCREAMING_SNAKE_CASE enums.
      * Timestamps are RFC 3339 UTC strings. The client stores epoch milliseconds.
      * Every failure uses the same `Error` envelope with a stable machine-readable `code`.
      * Lists are cursor paginated. Never offset: a list that grows at the head skips rows.
  contact:
    name: AI Tutor
  license:
    name: Proprietary

servers:
  - url: https://api.example.com/v1
    description: Replace with your own host before implementing.

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Sign in, session refresh, sign out, account deletion.
  - name: User
    description: The signed-in student's profile, settings, entitlement and quota.
  - name: Chats
    description: Conversations and their messages.
  - name: Answers
    description: Asking a question and getting a tutor reply.
  - name: Feedback
    description: Rating and reporting an answer.
  - name: Billing
    description: Google Play purchase verification and entitlement.

paths:

  # ----------------------------------------------------------------------------- Auth

  /auth/google:
    post:
      tags: [Auth]
      summary: Exchange a Google ID token for a session
      description: |
        The only way into the app. The client obtains a Google ID token through Credential Manager
        and posts it here; the server verifies it and returns **its own** tokens.

        The Google ID token is an identity assertion, not a session — it is never sent as the bearer
        on any other endpoint.
      security: []
      operationId: signInWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: The Google ID token (a JWT). Its `aud` must be the **Web** client ID.
                device:
                  $ref: '#/components/schemas/DeviceInfo'
      responses:
        '200':
          description: Signed in. A session was created.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresIn, tokenType, isNewUser, user]
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                    description: Opaque and single-use. Rotated on every refresh.
                  expiresIn:
                    type: integer
                    description: Access token lifetime in seconds.
                    examples: [3600]
                  tokenType:
                    type: string
                    const: Bearer
                  isNewUser:
                    type: boolean
                    description: |
                      True on the very first sign-in for this Google account. The client uses it to
                      decide whether to run profile setup or go straight to Home.
                  user:
                    $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/InvalidGoogleToken'
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the session
      description: |
        Called when a request returns 401. The old refresh token is consumed and a new pair is
        issued. A 401 here means the session is gone for good: the client clears it and shows the
        sign-in screen.
      security: []
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresIn, tokenType]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer, examples: [3600] }
                  tokenType: { type: string, const: Bearer }
        '401':
          description: The refresh token is invalid, expired, revoked or replayed. Sign the user out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      description: Revokes the refresh token supplied. Other devices keep their sessions.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/account:
    delete:
      tags: [Auth]
      summary: Delete the account and all of its data
      description: |
        Required by Google Play for any app offering in-app account creation. Deletes the user,
        their profile, every chat and message, and every stored attachment, and revokes all
        sessions. Play also requires a publicly reachable web URL that does the same thing.

        An active Play subscription is **not** cancelled by this call — the user must do that in
        Play. The response says whether one is still running so the client can tell them.
      operationId: deleteAccount
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
                  activeSubscriptionRemains:
                    type: boolean
                    description: True if a Play subscription is still active and must be cancelled in Play.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ----------------------------------------------------------------------------- User

  /me:
    get:
      tags: [User]
      summary: Everything the app needs after sign-in
      description: |
        One call that fills the whole app: identity, profile, settings, entitlement and quota.
        The client makes this immediately after sign-in and on every cold start.
      operationId: getMe
      responses:
        '200':
          description: The signed-in student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/profile:
    patch:
      tags: [User]
      summary: Update the study profile
      description: |
        What the four setup screens collect. The client commits once at the end of setup, and again
        whenever a row on Profile is edited. Every field is optional — omitted fields are left alone.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentProfile' }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '400':
          description: |
            Validation failed. Most commonly more than two goals — the app caps this at two in the
            UI, so it should not normally happen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/settings:
    patch:
      tags: [User]
      summary: Update app settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettings' }
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ----------------------------------------------------------------------------- Chats

  /chats:
    get:
      tags: [Chats]
      summary: List conversations
      description: |
        Backs the History screen and the "Continue studying" card on Home. Newest first, by
        `updatedAt`.

        History's filter chips (All, Chats, Solved, Summaries, Writing) are derived on the client
        from each entry's tool, so there is no filter parameter here — the client already has what
        it needs once it has the tool.
      operationId: listChats
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Chat' }
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as `cursor` for the next page. Null on the last page.
        '401': { $ref: '#/components/responses/Unauthenticated' }

    post:
      tags: [Chats]
      summary: Start a conversation
      description: |
        Called when a student taps a tool. The chat exists before its first question, which is what
        lets the title and subject be shown in the header straight away.
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool: { $ref: '#/components/schemas/StudyTool' }
                title:
                  type: string
                  description: Defaults to the tool's own name if omitted.
                  maxLength: 200
                subject:
                  type: string
                  description: |
                    Free text, not the `Subject` enum — a chat's subject is a display label the
                    client sets from context, while `profile.subjects` is the enumerated set.
                  maxLength: 100
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /chats/{chatId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [Chats]
      summary: One conversation, with its newest messages
      operationId: getChat
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The chat and a page of messages, oldest to newest.
          content:
            application/json:
              schema:
                type: object
                required: [chat, messages, nextCursor]
                properties:
                  chat: { $ref: '#/components/schemas/Chat' }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor:
                    type: [string, 'null']
                    description: Cursor for *older* messages, for scrolling back.
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    patch:
      tags: [Chats]
      summary: Rename a conversation
      operationId: renameChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    delete:
      tags: [Chats]
      summary: Delete a conversation
      description: Deletes its messages and their attachments too.
      operationId: deleteChat
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChatId'

    get:
      tags: [Chats]
      summary: Page back through older messages
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages, oldest to newest.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    post:
      tags: [Answers]
      summary: Ask a question, optionally with a file
      description: |
        The endpoint the app is built around.

        `multipart/form-data` with a JSON `payload` part and an optional `file` part. The question
        and its file travel together in one request.

        The request does **not** carry conversation history: the server stores the thread and reads
        it back itself. Only the new question is sent.

        The server stores the question, generates the answer, stores that too, and returns both
        along with the updated quota. If generation fails the question is still stored — the client
        shows the question with an error beneath it, never a fabricated reply.

        `Idempotency-Key` is required. A retry after a timeout must not consume a second question
        from the student's daily quota.
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: '#/components/schemas/AskPayload'
                file:
                  type: string
                  format: binary
                  description: |
                    At most 20 MB (`AttachmentStore.MAX_FILE_BYTES`). Accepted types are
                    `image/jpeg`, `application/pdf` and
                    `application/vnd.openxmlformats-officedocument.wordprocessingml.document`.

                    Images arrive as JPEG whatever was picked: the client re-encodes and downscales
                    to a 2000px long edge before upload.
            encoding:
              payload: { contentType: application/json }
              file:
                contentType: image/jpeg, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        '201':
          description: The question was stored and answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerResponse' }
        '207':
          description: |
            The question was stored but no answer could be generated — the upstream model failed or
            timed out. The client shows the question in the thread with a retry affordance. This
            does **not** consume quota.
          content:
            application/json:
              schema:
                type: object
                required: [userMessage, error]
                properties:
                  userMessage: { $ref: '#/components/schemas/Message' }
                  error: { $ref: '#/components/schemas/ErrorBody' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFileType' }
        '422': { $ref: '#/components/responses/FileUnreadable' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    delete:
      tags: [Chats]
      summary: Clear a conversation's messages, keeping the chat
      description: The "Clear chat" item in the chat options menu. Attachments go with the messages.
      operationId: clearMessages
      responses:
        '204': { description: Cleared. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /chats/{chatId}/messages/{messageId}/regenerate:
    parameters:
      - $ref: '#/components/parameters/ChatId'
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Answers]
      summary: Answer the same question again
      description: |
        The Regenerate action under an answer. `messageId` is the **assistant** message being
        replaced. The old answer is discarded and a new one stored in its place, so the thread never
        shows two answers to one question.

        This consumes quota: it is another generation.
      operationId: regenerateAnswer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: A fresh answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerResponse' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /messages/{messageId}/attachment:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      tags: [Chats]
      summary: Download a message's attachment
      description: |
        Needed because conversations sync. A thread opened on a second device has messages whose
        attachment exists only on the phone that sent it, so the file has to be fetchable.

        Redirects to a short-lived signed URL rather than streaming bytes through the API.
      operationId: getAttachment
      responses:
        '200':
          description: |
            The file itself, if you choose to stream through the API rather than redirect. Note that
            OkHttp follows redirects by default, so the client sees this either way.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to a signed URL, valid for a few minutes.
          headers:
            Location:
              schema: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ----------------------------------------------------------------------------- Feedback

  /messages/{messageId}/feedback:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Feedback]
      summary: Rate an answer
      description: |
        The thumbs up and thumbs down under an answer. Sending the same rating again clears it, so
        the buttons toggle.
      operationId: rateAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: string
                  enum: [HELPFUL, NOT_HELPFUL]
      responses:
        '204': { description: Recorded. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /messages/{messageId}/report:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Feedback]
      summary: Report an answer
      description: The Flag item in the answer options sheet.
      operationId: reportAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [INCORRECT, HARMFUL, OFF_TOPIC, OTHER]
                detail:
                  type: string
                  maxLength: 1000
      responses:
        '204': { description: Reported. }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ----------------------------------------------------------------------------- Billing

  /billing/play/verify:
    post:
      tags: [Billing]
      summary: Verify a Play purchase and grant entitlement
      description: |
        Called right after Play Billing reports a purchase on the device. The app sends the token
        and reads back the resulting entitlement — it never sets entitlement itself.

        Should be idempotent on the purchase token: the same token sent twice grants once.
      operationId: verifyPlayPurchase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseToken, productId]
              properties:
                purchaseToken: { type: string }
                productId:
                  type: string
                  enum: [premium_yearly, premium_monthly]
                  description: Must match the products created in the Play Console.
      responses:
        '200':
          description: Verified. The entitlement as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '402':
          description: Play rejected the token, or the purchase is not in a granting state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /billing/restore:
    post:
      tags: [Billing]
      summary: Re-check Play for existing purchases
      description: |
        The Restore purchases button. The client queries Play for the account's active purchases and
        posts their tokens; the server re-verifies each and returns the resulting entitlement.
      operationId: restorePurchases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseTokens]
              properties:
                purchaseTokens:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The entitlement after re-verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /billing/entitlement:
    get:
      tags: [Billing]
      summary: The current plan
      description: Also present inside `GET /me`; this exists for a cheap re-check after a purchase.
      operationId: getEntitlement
      responses:
        '200':
          description: The entitlement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

# ================================================================================= Components

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from `/auth/google` or `/auth/refresh` — never a Google ID token.

  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: The `nextCursor` from the previous page. Omit for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        A UUID the client generates once per logical action and reuses on every retry of it. The
        server replays the original response rather than acting twice.

  schemas:

    # ---- Identity -------------------------------------------------------------

    DeviceInfo:
      type: object
      description: Optional context, for session management and support.
      properties:
        platform: { type: string, enum: [ANDROID, IOS, WEB] }
        appVersion: { type: string, examples: ["1.0"] }
        osVersion: { type: string, examples: ["14"] }
        deviceId:
          type: string
          description: A client-generated install id. Not a hardware identifier.

    Me:
      type: object
      required: [userId, email, profile, settings, entitlement, quota, createdAt]
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        displayName:
          type: [string, 'null']
          description: From the Google account. The Profile hero shows this when the student set no name.
        photoUrl: { type: [string, 'null'], format: uri }
        emailVerified: { type: boolean }
        profile: { $ref: '#/components/schemas/StudentProfile' }
        settings: { $ref: '#/components/schemas/UserSettings' }
        entitlement: { $ref: '#/components/schemas/Entitlement' }
        quota: { $ref: '#/components/schemas/Quota' }
        createdAt: { type: string, format: date-time }

    # ---- Profile and settings -------------------------------------------------

    StudentProfile:
      type: object
      description: Mirrors `domain/model/StudentProfile.kt`. Every field is optional on PATCH.
      properties:
        name:
          type: string
          maxLength: 100
          description: The student's first name. May be empty — the setup step is skippable.
        level: { $ref: '#/components/schemas/StudyLevel' }
        grade: { $ref: '#/components/schemas/Grade' }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/Subject' }
          uniqueItems: true
        goals:
          type: array
          items: { $ref: '#/components/schemas/StudyGoal' }
          uniqueItems: true
          maxItems: 2
          description: Capped at two (`StudentProfile.MAX_GOALS`). The server enforces it.
        dailyTime: { $ref: '#/components/schemas/StudyTime' }
        reminderEnabled: { type: boolean }

    UserSettings:
      type: object
      description: Mirrors the non-profile half of `data/prefs/UserPreferencesRepository.kt`.
      properties:
        language:
          type: string
          enum: [en, es, fr, de, pt, tr, id, hi, ur, ar, bn, zh]
          description: A BCP-47 tag, one of the twelve `AppLanguage` values. Also the answer language.
        remindersEnabled: { type: boolean }
        voiceInputEnabled: { type: boolean }
        themeMode: { $ref: '#/components/schemas/ThemeMode' }

    StudyLevel:
      type: string
      enum: [SCHOOL, COLLEGE, UNIVERSITY]

    Grade:
      type: string
      enum: [GRADES_1_5, GRADE_6, GRADE_7, GRADE_8, GRADE_9, GRADE_10, GRADE_11, GRADE_12]

    Subject:
      type: string
      enum: [MATH, PHYSICS, CHEMISTRY, BIOLOGY, ENGLISH, HISTORY, GEOGRAPHY, COMPUTER_SCIENCE, ECONOMICS, LANGUAGES, ART, OTHER]

    StudyGoal:
      type: string
      enum: [ACE_EXAMS, FINISH_HOMEWORK, UNDERSTAND_TOPICS, IMPROVE_WRITING]

    StudyTime:
      type: string
      enum: [MINUTES_15, MINUTES_30, HOUR_1, HOURS_2_PLUS]

    ThemeMode:
      type: string
      enum: [LIGHT, DARK, SYSTEM]

    StudyTool:
      type: string
      description: The ten tools in `domain/model/StudyTool.kt`, in the order it declares them.
      enum:
        - CHATBOT
        - HOMEWORK_SOLVER
        - MATH_SOLVER
        - NOTES_SUMMARIZER
        - AI_TUTOR
        - GRAMMAR_FIXER
        - ESSAY_WRITER
        - PARAPHRASING
        - SUMMARY_GENERATOR
        - CONCEPT_EXPLAINER

    ScanSource:
      type: string
      description: Which tile in the scan sheet produced the file. Mirrors `ScanSource`.
      enum: [CAMERA, GALLERY, PDF, WORD]

    # ---- Chats and messages ---------------------------------------------------

    Chat:
      type: object
      required: [chatId, tool, title, subject, createdAt, updatedAt, messageCount]
      properties:
        chatId: { type: string }
        tool: { $ref: '#/components/schemas/StudyTool' }
        title: { type: string }
        subject:
          type: string
          description: Free text, not the `Subject` enum. See `POST /chats`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }

    Message:
      type: object
      required: [messageId, chatId, role, createdAt]
      properties:
        messageId: { type: string }
        chatId: { type: string }
        role: { type: string, enum: [USER, ASSISTANT] }
        text:
          type: [string, 'null']
          description: The question, for a `USER` message. Null for an `ASSISTANT` message.
        blocks:
          type: [array, 'null']
          description: The answer, for an `ASSISTANT` message. Null for a `USER` message.
          items: { $ref: '#/components/schemas/AnswerBlock' }
        attachment:
          oneOf:
            - $ref: '#/components/schemas/Attachment'
            - type: 'null'
        rating:
          type: [string, 'null']
          enum: [HELPFUL, NOT_HELPFUL, null]
        createdAt: { type: string, format: date-time }

    AnswerBlock:
      description: |
        One line of an answer. Mirrors the `AnswerBlock` sealed interface: replies are structured
        rather than one blob of prose, which is what makes them skimmable and what lets the
        select-text screen re-render the same answer at reading size.
      oneOf:
        - $ref: '#/components/schemas/ParagraphBlock'
        - $ref: '#/components/schemas/BulletBlock'
      discriminator:
        propertyName: type
        mapping:
          PARAGRAPH: '#/components/schemas/ParagraphBlock'
          BULLET: '#/components/schemas/BulletBlock'

    ParagraphBlock:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: PARAGRAPH }
        text: { type: string }

    BulletBlock:
      type: object
      required: [type, term, text]
      properties:
        type: { type: string, const: BULLET }
        term:
          type: string
          description: The bolded lead-in. Rendered in the accent colour.
        text: { type: string }

    Attachment:
      type: object
      required: [source, fileName, mimeType, sizeBytes]
      properties:
        source: { $ref: '#/components/schemas/ScanSource' }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        downloadUrl:
          type: [string, 'null']
          format: uri
          description: Set on read. Points at `GET /messages/{messageId}/attachment`.

    AskPayload:
      type: object
      description: The JSON part of the multipart send.
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 8000
          description: May be empty-ish only if a file is attached; otherwise at least one character.
        tool:
          $ref: '#/components/schemas/StudyTool'
        subject:
          type: string
          description: Overrides the chat's subject for this question only.
        attachment:
          description: Metadata for the `file` part. Omit when no file is sent.
          oneOf:
            - $ref: '#/components/schemas/Attachment'
            - type: 'null'

    AnswerResponse:
      type: object
      required: [userMessage, answer, quota]
      properties:
        userMessage: { $ref: '#/components/schemas/Message' }
        answer: { $ref: '#/components/schemas/Message' }
        quota: { $ref: '#/components/schemas/Quota' }

    # ---- Entitlement and quota ------------------------------------------------

    Entitlement:
      type: object
      required: [plan]
      description: |
        Read-only to the client. The server is the sole writer, and only after verifying a Play
        purchase token. Nothing in the app may grant Pro locally.
      properties:
        plan: { type: string, enum: [FREE, PRO] }
        productId:
          type: [string, 'null']
          enum: [premium_yearly, premium_monthly, null]
        expiresAt: { type: [string, 'null'], format: date-time }
        autoRenewing: { type: [boolean, 'null'] }
        inGracePeriod:
          type: [boolean, 'null']
          description: Play is retrying payment. Keep access and prompt the user to fix it.
        source: { type: [string, 'null'], enum: [PLAY, PROMO, null] }

    Quota:
      type: object
      required: [unlimited]
      description: |
        The free tier's daily question limit — the thing the paywall's "No daily limit on AI chats"
        is promising to remove. The server owns this counter; the client only displays it.
      properties:
        unlimited:
          type: boolean
          description: True for a Pro entitlement, in which case the other fields are null.
        limit: { type: [integer, 'null'] }
        remaining: { type: [integer, 'null'] }
        resetsAt:
          type: [string, 'null']
          format: date-time
          description: When `remaining` returns to `limit`. Midnight UTC unless you choose otherwise.

    # ---- Errors ---------------------------------------------------------------

    Error:
      type: object
      required: [error, requestId]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        requestId:
          type: string
          description: Echoed in logs. Worth showing in a support screen.

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable and machine-readable. The client switches on this, never on `message`.
            See the error table in README.md for what the app does with each one.
          enum:
            - UNAUTHENTICATED
            - TOKEN_EXPIRED
            - INVALID_GOOGLE_TOKEN
            - REFRESH_TOKEN_REUSED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - QUOTA_EXCEEDED
            - RATE_LIMITED
            - FILE_TOO_LARGE
            - UNSUPPORTED_FILE_TYPE
            - FILE_UNREADABLE
            - PAYMENT_VERIFICATION_FAILED
            - UPSTREAM_UNAVAILABLE
            - INTERNAL
        message:
          type: string
          description: English, for logs and developers. Never shown to a student — the app has its own strings.
        details:
          type: [object, 'null']
          additionalProperties: true

  responses:
    Unauthenticated:
      description: Missing, malformed or expired access token. Refresh once, then retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidGoogleToken:
      description: The Google ID token failed verification.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource, or it belongs to another user. Both answer the same way.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: The request body did not validate.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QuotaExceeded:
      description: The daily free limit is used up. The client opens the Pro paywall.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the quota resets.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileTooLarge:
      description: Over 20 MB. Renders `attach_error_too_large`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedFileType:
      description: Not a JPEG, PDF or .docx. Renders `attach_error_unsupported`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileUnreadable:
      description: The file was received but could not be parsed. Renders `attach_error_unreadable`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
