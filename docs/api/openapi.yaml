openapi: 3.1.0

info:
  title: AI Tutor API
  version: "2.0.0"
  description: |
    The backend contract for the AI Tutor Android app: eleven endpoints.

    Every schema here mirrors a type that already exists in the client, so the names and enum values
    are not invented. They are the wire form of `StudentProfile`, `StudyTool`, `AnswerBlock` and the
    rest. `docs/api/README.md` holds the prose: how sign-in works, the quota model, the error table
    and the Firebase setup this depends on.

    **Sign-in is not part of this API.** The app signs in with Firebase (Google, or an anonymous
    account for "Skip for now") and sends the Firebase ID token as the bearer on every call except
    `GET /config`. The server only verifies that token. There is no login, refresh or logout endpoint.

    Conventions:
      * JSON in and out, camelCase fields, SCREAMING_SNAKE_CASE enums.
      * Timestamps are RFC 3339 UTC strings. The client stores epoch milliseconds.
      * Every failure uses the same `Error` envelope with a stable machine-readable `code`.
      * Lists are cursor paginated. Never offset: a list that grows at the head skips rows.

    Changes since version 1.0 (the 22-endpoint design) and the 7 October plan: login moved to
    Firebase; account deletion is `DELETE /me`; the Daily challenge endpoint, `challengeId` and
    "Clear messages" are gone because the app no longer has them; the single `POST /chat` replaces the
    separate create, send and regenerate calls.
  contact:
    name: AI Tutor
  license:
    name: Proprietary

servers:
  - url: https://api.example.com/v1
    description: Replace with your own host before implementing.

security:
  - firebaseIdToken: []

tags:
  - name: Account
    description: The signed-in user's identity, profile, settings, plan and quota.
  - name: Chat
    description: Asking a question. One endpoint serves every study tool.
  - name: History
    description: Past conversations and their messages.
  - name: Feedback
    description: Rating and reporting an answer.
  - name: Billing
    description: Google Play purchase verification.
  - name: App
    description: Settings the app reads before anyone signs in.

paths:

  # ----------------------------------------------------------------------------- Account

  /me:
    get:
      tags: [Account]
      summary: Everything the app needs after sign-in
      description: |
        One call that fills the whole app: identity, profile, settings, plan and quota. The client
        makes it right after sign-in and on every cold start.

        **The first call for a new `uid` creates the account.** There is no sign-up endpoint. A new
        account comes back with `setupCompleted: false`, which is what sends the app to profile setup.
        When it is `true`, the app goes straight to Home, so someone who signs in on a new phone does
        not repeat setup.

        A skipped ("anonymous") account has no `email`, `displayName` or `photoUrl`.
      operationId: getMe
      responses:
        '200':
          description: The signed-in student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    patch:
      tags: [Account]
      summary: Change profile answers and settings
      description: |
        Send only what changed. Omitted fields are left alone. The response is the full `/me` again.

        The app calls it with: the whole profile and `setupCompleted: true` once, at the end of first-time
        setup; one field at a time from the four edit screens on Profile (name; level and grade;
        subjects; goals and daily time); and a single setting from Language or the Profile switches.

        `profile.name` may be an empty string, because the name step is optional.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: The updated student.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400':
          description: |
            Validation failed. Most commonly more than two goals. The app caps it at two in the UI, so
            it should not normally happen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    delete:
      tags: [Account]
      summary: Delete the account and all of its data
      description: |
        Required by Google Play for any app that creates accounts. Deletes the user, profile, every chat
        and message, every stored file, and the Firebase account itself (Admin SDK `deleteUser`). The app
        then signs out on the phone. Play also requires a publicly reachable web URL that does the same
        thing (`urls.accountDeletion` in `/config`).

        An active Play subscription is **not** cancelled by this call. The user must do that in Play. The
        response says whether one is still running so the app can tell them.
      operationId: deleteAccount
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
                  activeSubscriptionRemains:
                    type: boolean
                    description: True if a Play subscription is still active and must be cancelled in Play.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ----------------------------------------------------------------------------- Chat

  /chat:
    post:
      tags: [Chat]
      summary: Ask any tool a question, optionally with a file
      description: |
        The endpoint the app is built around. The tool is a word in the request, so a new tool later is a
        new word on the backend and no new endpoint. (The app still needs an update to show a new tool's
        name and icon.)

        Send JSON for a text-only question. With a file, send `multipart/form-data`: the same fields as a
        JSON part named `payload`, and the bytes in a part named `file`.

        The request does **not** carry conversation history. The server stores the thread and reads it
        back itself. Only the new question is sent.

        The server stores the question, generates the answer, stores that too, and returns both with the
        updated quota. If generation fails, the question is still stored and the response is `207`. The
        app shows the question with a retry, never a made-up reply.

        To start a chat, leave `chatId` empty. The server creates it, titles it from the first question
        (from the file name when only a file is sent), cut at 60 characters, and returns its id. The app
        sends nothing until a first question exists, so opening a tool and leaving creates no chat.

        To regenerate, send the **assistant** message id as `regenerateMessageId`. The old answer is
        replaced, so the thread never shows two answers to one question. This uses quota, like any other
        generation.

        `Idempotency-Key` is required. A retry after a timeout must return the same answer and count
        once against the daily quota.
      operationId: sendChat
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: '#/components/schemas/ChatRequest'
                file:
                  type: string
                  format: binary
                  description: |
                    At most 20 MB. Accepted types are `image/jpeg`, `application/pdf` and
                    `application/vnd.openxmlformats-officedocument.wordprocessingml.document`.

                    Images arrive as JPEG whatever was picked: the app re-encodes and downscales to a 2000px
                    long edge before upload.
            encoding:
              payload: { contentType: application/json }
              file:
                contentType: image/jpeg, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        '201':
          description: The question was stored and answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '207':
          description: |
            The question was stored but no answer could be made: the upstream model failed or timed out.
            The app keeps the question in the thread and offers a retry. This does **not** use quota.
          content:
            application/json:
              schema:
                type: object
                required: [chatId, userMessage, error]
                properties:
                  chatId: { type: string }
                  userMessage: { $ref: '#/components/schemas/Message' }
                  error: { $ref: '#/components/schemas/ErrorBody' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFileType' }
        '422': { $ref: '#/components/responses/FileUnreadable' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }

  # ----------------------------------------------------------------------------- History

  /chats:
    get:
      tags: [History]
      summary: List conversations
      description: |
        Backs the History tab and Home's "Continue learning" (`limit=1`) and "Recent activity"
        (`limit=3`). Newest first, by `updatedAt`.

        History's filter chips (All, Chats, Solved, Summaries, Writing) map to `category`. Which tools
        belong to each is in the tool table in `docs/api/README.md`.
      operationId: listChats
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: Search text. Matches chat titles and message text.
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, CHATS, SOLVED, SUMMARIES, WRITING]
            default: ALL
      responses:
        '200':
          description: A page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Chat' }
                  nextCursor:
                    type: [string, 'null']
                    description: Pass as `cursor` for the next page. Null on the last page.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /chats/{chatId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'

    get:
      tags: [History]
      summary: One conversation, with its newest messages
      description: |
        Messages come oldest to newest. For older ones, pass `before` with the `nextCursor`. Attachment
        links expire after about ten minutes, so the app fetches the chat again to get fresh ones.
      operationId: getChat
      parameters:
        - name: before
          in: query
          required: false
          schema: { type: string }
          description: The `nextCursor` from the previous response, to load older messages.
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The chat and a page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [chat, messages, nextCursor]
                properties:
                  chat: { $ref: '#/components/schemas/Chat' }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor:
                    type: [string, 'null']
                    description: Cursor for *older* messages. Null when there are no more.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [History]
      summary: Rename a conversation
      description: The Rename chat dialog in the chat menu.
      operationId: renameChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: |
                    The app sends at most 61 characters: up to 60 typed, or a 60-character cut of the first
                    question followed by an ellipsis.
      responses:
        '200':
          description: Renamed. The updated chat, as in the list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chat' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [History]
      summary: Delete a conversation
      description: |
        Deletes the chat, its messages and their files. The app asks the person to confirm first, and
        stops any answer still being generated for it before calling this.
      operationId: deleteChat
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------- Feedback

  /messages/{messageId}/feedback:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Feedback]
      summary: Rate or report an answer
      description: |
        `messageId` is the answer's id. Send a rating, a report, or both.

        `NONE` clears an earlier rating, so the thumb buttons can switch off.
      operationId: sendFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                rating:
                  type: string
                  enum: [HELPFUL, NOT_HELPFUL, NONE]
                report:
                  type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      enum: [INCORRECT, HARMFUL, OFF_TOPIC, OTHER]
                    detail:
                      type: string
                      maxLength: 1000
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------------------------- Billing

  /billing/verify:
    post:
      tags: [Billing]
      summary: Verify Google Play purchases and grant Pro
      description: |
        After a purchase, send that one purchase. For "Restore purchase", send every active one. The
        server checks each token with Google Play and is the only thing that can grant Pro. The app
        reads the plan and never sets it.

        Idempotent on the purchase token: the same token sent twice grants once.

        **Open decision:** a purchase on an anonymous account is lost when the person logs out. The
        recommendation is to answer `403 ACCOUNT_REQUIRED` for an anonymous token, so Pro needs a Google
        sign-in. The app does not handle that code yet.
      operationId: verifyPurchases
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchases]
              properties:
                purchases:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, purchaseToken]
                    properties:
                      productId:
                        type: string
                        enum: [premium_yearly, premium_monthly]
                        description: Must match the products created in the Play Console.
                      purchaseToken: { type: string }
      responses:
        '200':
          description: Verified. The plan as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402':
          description: Play rejected the token, or the purchase is not in a granting state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ----------------------------------------------------------------------------- App

  /config:
    get:
      tags: [App]
      summary: Settings the app reads before anyone signs in
      description: |
        If the installed version is lower than `minAppVersion`, the app shows an update screen. This is
        the only way to stop old app versions from using a changed API. The app works without it, so keep
        it only if you want that control. The Privacy and Help links on Profile come from `urls`.
      operationId: getConfig
      security: []
      responses:
        '200':
          description: The current configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }

# ================================================================================= Components

components:

  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The Firebase ID token, as returned by `getIdToken()` in the app. It lasts one hour and the app
        renews it, so there is no refresh endpoint.

        Verify it with the Firebase Admin SDK, or check the JWT yourself: the signature against Google's
        public keys, `iss` equal to `https://securetoken.google.com/<firebase-project-id>`, `aud` equal
        to `<firebase-project-id>`, and not expired. `sub` is the user id. `firebase.sign_in_provider` is
        `google.com` or `anonymous`.

  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: The `nextCursor` from the previous page. Omit for the first page.
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        A UUID the app generates once per logical action and reuses on every retry of it. The server
        replays the original response rather than acting twice.

  schemas:

    # ---- Account ---------------------------------------------------------------

    Me:
      type: object
      required: [userId, isAnonymous, setupCompleted, profile, settings, plan, quota]
      properties:
        userId:
          type: string
          maxLength: 128
          description: The Firebase `uid`. Do not assume a prefix or a format.
        isAnonymous:
          type: boolean
          description: True for a "Skip for now" account.
        email:
          type: [string, 'null']
          format: email
          description: Null for an anonymous account.
        displayName:
          type: [string, 'null']
          description: |
            From the Google account; null when anonymous. The app offers its first word as the name on
            the setup screen.
        photoUrl: { type: [string, 'null'], format: uri }
        setupCompleted:
          type: boolean
          description: False until the app has sent the setup answers. Decides setup versus Home.
        profile: { $ref: '#/components/schemas/StudentProfile' }
        settings: { $ref: '#/components/schemas/UserSettings' }
        plan: { $ref: '#/components/schemas/Plan' }
        quota: { $ref: '#/components/schemas/Quota' }

    MeUpdate:
      type: object
      minProperties: 1
      properties:
        profile: { $ref: '#/components/schemas/StudentProfile' }
        settings: { $ref: '#/components/schemas/UserSettings' }
        setupCompleted:
          type: boolean
          const: true
          description: Only ever sent as `true`, with the setup answers, at the end of setup.

    StudentProfile:
      type: object
      description: Mirrors `domain/model/StudentProfile.kt`. Every field is optional on PATCH.
      properties:
        name:
          type: string
          maxLength: 100
          description: The student's first name. May be empty, because the setup step is optional.
        level: { $ref: '#/components/schemas/StudyLevel' }
        grade: { $ref: '#/components/schemas/Grade' }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/Subject' }
          uniqueItems: true
        goals:
          type: array
          items: { $ref: '#/components/schemas/StudyGoal' }
          uniqueItems: true
          maxItems: 2
          description: Capped at two (`StudentProfile.MAX_GOALS`). The server enforces it.
        dailyTime: { $ref: '#/components/schemas/StudyTime' }

    UserSettings:
      type: object
      description: |
        Mirrors the settings half of `data/prefs/UserPreferencesRepository.kt`. The chat text size is
        not here: it is saved on the phone only.
      properties:
        language:
          type: string
          enum: [en, es, fr, de, pt, tr, id, hi, ur, ar, bn, zh]
          description: A BCP-47 tag, one of the twelve `AppLanguage` values. Also the answer language.
        remindersEnabled: { type: boolean }
        voiceInputEnabled: { type: boolean }
        themeMode: { $ref: '#/components/schemas/ThemeMode' }

    Plan:
      type: object
      required: [plan]
      description: |
        Read-only to the app. The server is the only writer, and only after verifying a Play purchase
        token. Nothing in the app may grant Pro locally.
      properties:
        plan: { type: string, enum: [FREE, PRO] }
        productId:
          type: [string, 'null']
          enum: [premium_yearly, premium_monthly, null]
        expiresAt: { type: [string, 'null'], format: date-time }
        autoRenewing: { type: [boolean, 'null'] }

    Quota:
      type: object
      required: [unlimited]
      description: |
        The free tier's daily question limit. The server owns the counter; the app only displays it and
        opens the Pro screen on `QUOTA_EXCEEDED`.
      properties:
        unlimited:
          type: boolean
          description: True for Pro, in which case the other fields are null.
        limit: { type: [integer, 'null'] }
        remaining: { type: [integer, 'null'] }
        resetsAt:
          type: [string, 'null']
          format: date-time
          description: When `remaining` returns to `limit`. Midnight UTC unless you choose otherwise.

    # ---- Enums -----------------------------------------------------------------

    StudyLevel:
      type: string
      enum: [SCHOOL, COLLEGE, UNIVERSITY]

    Grade:
      type: string
      enum: [GRADES_1_5, GRADE_6, GRADE_7, GRADE_8, GRADE_9, GRADE_10, GRADE_11, GRADE_12, OTHER]

    Subject:
      type: string
      enum: [MATH, PHYSICS, CHEMISTRY, BIOLOGY, ENGLISH, HISTORY, GEOGRAPHY, COMPUTER_SCIENCE, ECONOMICS, LANGUAGES, ART, OTHER]

    StudyGoal:
      type: string
      enum: [ACE_EXAMS, FINISH_HOMEWORK, UNDERSTAND_TOPICS, IMPROVE_WRITING]

    StudyTime:
      type: string
      enum: [MINUTES_15, MINUTES_30, HOUR_1, HOURS_2_PLUS]

    ThemeMode:
      type: string
      enum: [LIGHT, DARK, SYSTEM]

    StudyTool:
      type: string
      description: The ten tools in `domain/model/StudyTool.kt`, in the order it declares them.
      enum:
        - CHATBOT
        - HOMEWORK_SOLVER
        - MATH_SOLVER
        - NOTES_SUMMARIZER
        - AI_TUTOR
        - GRAMMAR_FIXER
        - ESSAY_WRITER
        - PARAPHRASING
        - SUMMARY_GENERATOR
        - CONCEPT_EXPLAINER

    # ---- Chat ------------------------------------------------------------------

    ChatRequest:
      type: object
      required: [tool]
      description: The JSON body, or the `payload` part of a multipart send.
      properties:
        tool: { $ref: '#/components/schemas/StudyTool' }
        chatId:
          type: [string, 'null']
          description: Empty to start a new chat. The server creates it and returns the id.
        message:
          type: string
          maxLength: 8000
          description: |
            The question. Required unless a file is attached (a file on its own is a question) or
            `regenerateMessageId` is set. Otherwise at least one character.
        regenerateMessageId:
          type: [string, 'null']
          description: The **assistant** message to replace, for the Regenerate button.

    ChatResponse:
      type: object
      required: [chatId, userMessage, answer, quota]
      properties:
        chatId: { type: string }
        userMessage: { $ref: '#/components/schemas/Message' }
        answer: { $ref: '#/components/schemas/Message' }
        quota: { $ref: '#/components/schemas/Quota' }

    Chat:
      type: object
      required: [chatId, tool, title, subject, updatedAt, messageCount]
      properties:
        chatId: { type: string }
        tool: { $ref: '#/components/schemas/StudyTool' }
        title: { type: string }
        subject:
          type: string
          description: Free text, a display label. Not the `Subject` enum.
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }

    Message:
      type: object
      required: [messageId, role]
      properties:
        messageId: { type: string }
        role: { type: string, enum: [USER, ASSISTANT] }
        text:
          type: [string, 'null']
          description: The question, for a `USER` message. Absent for an `ASSISTANT` message.
        blocks:
          type: [array, 'null']
          description: The answer, for an `ASSISTANT` message. Absent for a `USER` message.
          items: { $ref: '#/components/schemas/AnswerBlock' }
        attachment:
          oneOf:
            - $ref: '#/components/schemas/Attachment'
            - type: 'null'
        rating:
          type: [string, 'null']
          enum: [HELPFUL, NOT_HELPFUL, null]
        createdAt: { type: string, format: date-time }

    AnswerBlock:
      description: |
        One line of an answer. Plain text, not Markdown: the app has no Markdown renderer, so `**bold**`
        would show as asterisks. Mirrors the `AnswerBlock` sealed interface.
      oneOf:
        - $ref: '#/components/schemas/ParagraphBlock'
        - $ref: '#/components/schemas/BulletBlock'
      discriminator:
        propertyName: type
        mapping:
          PARAGRAPH: '#/components/schemas/ParagraphBlock'
          BULLET: '#/components/schemas/BulletBlock'

    ParagraphBlock:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: PARAGRAPH }
        text: { type: string }

    BulletBlock:
      type: object
      required: [type, term, text]
      properties:
        type: { type: string, const: BULLET }
        term:
          type: string
          description: The bolded lead-in. Rendered in the accent colour.
        text: { type: string }

    Attachment:
      type: object
      required: [fileName, mimeType, sizeBytes]
      properties:
        fileName: { type: string }
        mimeType:
          type: string
          enum:
            - image/jpeg
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        sizeBytes: { type: integer, format: int64, maximum: 20971520 }
        url:
          type: [string, 'null']
          format: uri
          description: |
            Set when a chat is read. A short-lived signed link, valid for about ten minutes. The app
            fetches the chat again for fresh ones.

    # ---- App -------------------------------------------------------------------

    Config:
      type: object
      required: [minAppVersion, latestAppVersion, maintenance, urls, tools]
      properties:
        minAppVersion: { type: string, examples: ["1.0.0"] }
        latestAppVersion: { type: string, examples: ["1.2.0"] }
        maintenance:
          type: object
          required: [active]
          properties:
            active: { type: boolean }
            message: { type: [string, 'null'] }
        urls:
          type: object
          properties:
            terms: { type: string, format: uri }
            privacy: { type: string, format: uri }
            support: { type: string, format: uri }
            accountDeletion: { type: string, format: uri }
        freeDailyLimit: { type: integer }
        tools:
          type: array
          items:
            type: object
            required: [tool, enabled]
            properties:
              tool: { $ref: '#/components/schemas/StudyTool' }
              enabled: { type: boolean }
              isNew: { type: boolean }

    # ---- Errors ----------------------------------------------------------------

    Error:
      type: object
      required: [error, requestId]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        requestId:
          type: string
          description: Echoed in logs. Worth showing on a support screen.

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable and machine-readable. The app switches on this, never on `message`. See the error
            table in README.md for what the app does with each one.
          enum:
            - UNAUTHENTICATED
            - TOKEN_EXPIRED
            - INVALID_ID_TOKEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - UNKNOWN_TOOL
            - QUOTA_EXCEEDED
            - RATE_LIMITED
            - FILE_TOO_LARGE
            - UNSUPPORTED_FILE_TYPE
            - FILE_UNREADABLE
            - PAYMENT_VERIFICATION_FAILED
            - UPSTREAM_UNAVAILABLE
            - INTERNAL
        message:
          type: string
          description: English, for logs and developers. Never shown to a student, because the app has its own strings.
        details:
          type: [object, 'null']
          additionalProperties: true

  responses:
    Unauthenticated:
      description: |
        Missing, malformed or expired Firebase ID token (`UNAUTHENTICATED` or `TOKEN_EXPIRED`), or one
        that failed verification (`INVALID_ID_TOKEN`). The app asks Firebase for a fresh token and tries
        once more; a second 401 signs the person out.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource, or it belongs to another user. Both answer the same way.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: The request did not validate (`VALIDATION_FAILED`), or the tool word is unknown (`UNKNOWN_TOOL`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    QuotaExceeded:
      description: |
        `QUOTA_EXCEEDED`: the daily free limit is used up and the app opens the Pro screen. Also used,
        with the code `RATE_LIMITED`, when the app should just wait and honour `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the quota resets, or until a rate limit lifts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileTooLarge:
      description: Over 20 MB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedFileType:
      description: Not a JPEG, PDF or .docx.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileUnreadable:
      description: The file was received but could not be parsed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
